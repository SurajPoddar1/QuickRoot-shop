<!DOCTYPE html>
<html lang="en">
<head>
  <!-- =====================================================
       BASIC PAGE SETUP
       ===================================================== -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickRoot | Wishlist</title>

  <!-- =====================================================
       TAILWIND CSS
       ===================================================== -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- =====================================================
       GOOGLE FONT
       ===================================================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- =====================================================
       FONT AWESOME ICONS
       ===================================================== -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background: #f8fafc;
    }

    .wishlist-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 14px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      transition: 0.25s ease;
      overflow: hidden;
    }

    .wishlist-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
    }

    .wishlist-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 18px;
      background: #f8fafc;
    }
  </style>
</head>

<body class="text-slate-900">
  <!-- =====================================================
       NAVBAR
       ===================================================== -->
  <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 md:px-6 py-4 flex items-center justify-between gap-4 flex-wrap">
      <a href="index.html" class="text-3xl font-black text-green-600 tracking-tight">
        Quick<span class="text-orange-500">Root</span>
      </a>

      <div class="flex items-center gap-3 flex-wrap">
        <a href="index.html" class="bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-2xl font-bold transition">
          Home
        </a>

        <a href="shop.html" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-2xl font-bold transition">
          Shop
        </a>

        <a href="cart.html" class="relative">
          <div class="w-11 h-11 rounded-2xl bg-slate-100 flex items-center justify-center text-xl hover:bg-slate-200 transition">
            🛒
          </div>
          <span
            id="cart-count"
            class="absolute -top-2 -right-2 bg-red-500 text-white text-xs min-w-[20px] h-5 px-1 rounded-full flex items-center justify-center font-bold"
          >
            0
          </span>
        </a>
      </div>
    </div>
  </nav>

  <!-- =====================================================
       PAGE CONTENT
       ===================================================== -->
  <main class="max-w-7xl mx-auto px-4 md:px-6 py-8">
    <!-- PAGE HEADER -->
    <section class="mb-8">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div>
          <p class="text-sm font-bold text-red-500 mb-2">SAVED ITEMS</p>
          <h1 class="text-4xl md:text-5xl font-black">My Wishlist</h1>
          
        </div>

        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm px-6 py-4">
          <p class="text-sm text-slate-500">Total Wishlist Items</p>
          <p id="wishlist-total" class="text-3xl font-black text-red-500">0</p>
        </div>
      </div>
    </section>

    <!-- ACTION BAR -->
    <section class="mb-6">
      <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-4 flex flex-wrap gap-3 items-center justify-between">
        <div class="flex flex-wrap gap-3">
          <button onclick="goHome()" class="bg-slate-100 hover:bg-slate-200 px-5 py-3 rounded-2xl font-bold transition">
            ← Back to Home
          </button>

          <button onclick="goShop()" class="bg-green-600 hover:bg-green-700 text-white px-5 py-3 rounded-2xl font-bold transition">
            Browse More Fruits
          </button>
        </div>

        <button onclick="clearWishlist()" class="bg-red-500 hover:bg-red-600 text-white px-5 py-3 rounded-2xl font-bold transition">
          Clear Wishlist
        </button>
      </div>
    </section>

    <!-- WISHLIST GRID -->
    <section>
      <div id="wishlist-container" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-6"></div>
    </section>
  </main>

  <script>
    /* =====================================================
       STATE
       ===================================================== */
    let wishlistData = JSON.parse(localStorage.getItem("wishlist")) || [];
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    /* =====================================================
       HELPERS
       ===================================================== */
    function formatPrice(value) {
      return `₹${Number(value) || 0}`;
    }

    function updateCartCount() {
      const cartObj = JSON.parse(localStorage.getItem("cart")) || {};
      const count = Object.values(cartObj).reduce((a, b) => a + b, 0);

      const countBox = document.getElementById("cart-count");
      if (countBox) {
        countBox.innerText = count;
      }
    }

    function getStockText(stock) {
      if (stock <= 0) return "Out of Stock";
      if (stock <= 2) return `Only ${stock} left`;
      return "In Stock";
    }

    function getStockColor(stock) {
      if (stock <= 0) return "#dc2626";
      if (stock <= 2) return "#ea580c";
      return "#16a34a";
    }

    function getCartQty(id) {
      const currentCart = JSON.parse(localStorage.getItem("cart")) || {};
      return currentCart[id] || 0;
    }

    /* =====================================================
       PAGE NAVIGATION
       ===================================================== */
    function goHome() {
      window.location.href = "index.html";
    }

    function goShop() {
      window.location.href = "shop.html";
    }

    /* =====================================================
       LOAD WISHLIST
       NOTE:
       - Empty state bhi yahin handle hoga
       - Total count bhi yahin update hoga
       ===================================================== */
    function loadWishlist() {
      wishlistData = JSON.parse(localStorage.getItem("wishlist")) || [];
      updateCartCount();

      const container = document.getElementById("wishlist-container");
      const totalBox = document.getElementById("wishlist-total");

      totalBox.innerText = wishlistData.length;
      container.innerHTML = "";

      if (wishlistData.length === 0) {
        container.innerHTML = `
          <div class="col-span-full bg-white rounded-3xl border border-slate-200 shadow-sm p-10 text-center">
            <div class="text-5xl mb-4">❤️</div>
            <h2 class="text-3xl font-black mb-3">Wishlist is empty</h2>
            <p class="text-slate-500 mb-6 max-w-xl mx-auto leading-7">
              Abhi tak koi fruit save nahi hai. Shop me jao aur apne favourite fruits yahan add karo.
            </p>
            <button onclick="goShop()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-2xl font-black transition">
              Start Shopping
            </button>
          </div>
        `;
        return;
      }

      let html = "";

      wishlistData.forEach((item) => {
        const finalPrice = item.price - item.discount;
        const qty = getCartQty(item.id);
        const stock = Number(item.stock || 0);

        html += `
          <div class="wishlist-card">
            <div class="relative">
              <img src="${item.img}" alt="${item.name}" class="wishlist-img">

              <button
                onclick="removeWishlist(${item.id})"
                class="absolute top-3 right-3 bg-white text-red-500 w-11 h-11 rounded-full shadow-lg text-xl"
                title="Remove from wishlist"
              >
                ❤️
              </button>
            </div>

            <div class="flex gap-2 flex-wrap mt-4 mb-3">
              ${item.discount > 0 ? `<span class="bg-red-100 text-red-600 px-3 py-1 rounded-full text-xs font-black">${formatPrice(item.discount)} OFF</span>` : ""}
              ${item.organic ? `<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-black">Organic</span>` : ""}
              ${item.featured ? `<span class="bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full text-xs font-black">Featured</span>` : ""}
            </div>

            <h3 class="text-xl font-black mb-2">${item.name}</h3>
            <p class="text-sm text-slate-500 mb-1">${item.cat || "Fresh Fruit"}</p>
            <p class="text-sm text-slate-500 mb-2">${item.unit || "1 unit"}</p>

            <p class="text-sm font-bold mb-4" style="color:${getStockColor(stock)};">
              ${getStockText(stock)}
            </p>

            <div class="mb-4">
              <span class="line-through text-slate-400 text-sm">${formatPrice(item.price)}</span>
              <span class="text-green-600 font-black text-2xl ml-2">${formatPrice(finalPrice)}</span>
            </div>

            <div class="grid gap-3">
              <button onclick="viewDetails(${item.id})" class="bg-yellow-400 hover:bg-yellow-300 text-slate-900 py-3 rounded-2xl font-black transition">
                View Details
              </button>

              <div id="cart-box-${item.id}">
                ${
                  stock <= 0
                    ? `
                    <button disabled class="w-full bg-slate-300 text-slate-600 py-3 rounded-2xl font-black cursor-not-allowed">
                      Out of Stock
                    </button>
                  `
                    : qty > 0
                      ? `
                      <div class="flex items-center justify-center gap-3 bg-green-600 text-white py-3 rounded-2xl">
                        <button onclick="minusItem(${item.id})" class="bg-white text-green-600 px-3 py-1 rounded-xl font-black">-</button>
                        <span class="font-black min-w-[24px] text-center">${qty}</span>
                        <button onclick="plusItem(${item.id})" class="bg-white text-green-600 px-3 py-1 rounded-xl font-black">+</button>
                      </div>
                    `
                      : `
                      <button onclick="addToCart(${item.id})" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-2xl font-black transition">
                        Add to Cart
                      </button>
                    `
                }
              </div>

              <button onclick="removeWishlist(${item.id})" class="bg-red-500 hover:bg-red-600 text-white py-3 rounded-2xl font-black transition">
                Remove
              </button>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    /* =====================================================
       REMOVE SINGLE WISHLIST ITEM
       ===================================================== */
    function removeWishlist(id) {
      wishlistData = wishlistData.filter(item => Number(item.id) !== Number(id));
      localStorage.setItem("wishlist", JSON.stringify(wishlistData));
      loadWishlist();
    }

    /* =====================================================
       CLEAR FULL WISHLIST
       ===================================================== */
    function clearWishlist() {
      if (wishlistData.length === 0) {
        alert("Wishlist already empty");
        return;
      }

      localStorage.setItem("wishlist", JSON.stringify([]));
      loadWishlist();
      alert("Wishlist cleared");
    }

    /* =====================================================
       VIEW PRODUCT DETAILS
       NOTE:
       - Selected product localStorage me save hoga
       - Product page usko read karega
       ===================================================== */
    function viewDetails(id) {
      const item = wishlistData.find(f => Number(f.id) === Number(id));
      if (!item) return;

      localStorage.setItem("selectedProduct", JSON.stringify(item));
      localStorage.setItem("productSource", "wishlist");
      window.location.href = "product.html";
    }

    /* =====================================================
       CART ACTIONS
       NOTE:
       - Wishlist se direct cart add possible hai
       ===================================================== */
    function addToCart(id) {
      const item = wishlistData.find(f => Number(f.id) === Number(id));
      if (!item) return;

      const currentCart = JSON.parse(localStorage.getItem("cart")) || {};
      const stock = Number(item.stock || 0);

      if (stock <= 0) return;

      if (currentCart[id]) {
        if (currentCart[id] >= stock) {
          alert(`Only ${stock} items available`);
          return;
        }
        currentCart[id]++;
      } else {
        currentCart[id] = 1;
      }

      localStorage.setItem("cart", JSON.stringify(currentCart));
      loadWishlist();
    }

    function plusItem(id) {
      const item = wishlistData.find(f => Number(f.id) === Number(id));
      if (!item) return;

      const currentCart = JSON.parse(localStorage.getItem("cart")) || {};
      const stock = Number(item.stock || 0);

      if (!currentCart[id]) currentCart[id] = 0;

      if (currentCart[id] >= stock) {
        alert(`Only ${stock} items available`);
        return;
      }

      currentCart[id]++;
      localStorage.setItem("cart", JSON.stringify(currentCart));
      loadWishlist();
    }

    function minusItem(id) {
      const currentCart = JSON.parse(localStorage.getItem("cart")) || {};
      if (!currentCart[id]) return;

      if (currentCart[id] > 1) {
        currentCart[id]--;
      } else {
        delete currentCart[id];
      }

      localStorage.setItem("cart", JSON.stringify(currentCart));
      loadWishlist();
    }

    /* =====================================================
       PAGE START
       ===================================================== */
    loadWishlist();
  </script>
</body>
</html>
