<!DOCTYPE html>
<html lang="en">
<head>
  <!-- =====================================================
       BASIC PAGE SETUP
       ===================================================== -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickRoot | Login</title>

  <!-- =====================================================
       TAILWIND CSS
       ===================================================== -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- =====================================================
       GOOGLE FONT
       ===================================================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.15), transparent 30%),
        radial-gradient(circle at bottom right, rgba(255,255,255,0.08), transparent 25%),
        linear-gradient(135deg, #16a34a, #22c55e, #84cc16);
      min-height: 100vh;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.14);
    }
  </style>
</head>

<body class="text-slate-900">
  <!-- =====================================================
       MAIN WRAPPER
       ===================================================== -->
  <main class="min-h-screen flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-6xl grid lg:grid-cols-2 gap-8 items-center">
      <!-- =================================================
           LEFT SIDE BRAND SECTION
           ================================================= -->
      <section class="text-white hidden lg:block">
        <a href="index.html" class="inline-block text-4xl font-black tracking-tight mb-6">
          Mantu<span class="text-orange-300">Fruits</span>
        </a>

        <h1 class="text-5xl xl:text-6xl font-black leading-tight">
          Fresh Fruits <br>
          <span class="text-yellow-300">Fast & Easy Login</span>
        </h1>

        <!-- <p class="mt-6 text-lg text-green-50 max-w-xl leading-8">
          Login ya account create karo aur apne orders, profile aur tracking ko easy way me manage karo.
        </p> -->

        <div class="grid grid-cols-3 gap-4 mt-10 max-w-xl">
          <div class="bg-white/10 rounded-2xl p-4 text-center border border-white/15">
            <h3 class="text-2xl font-black">Fast</h3>
            <p class="text-sm text-green-50 mt-1">Login</p>
          </div>

          <div class="bg-white/10 rounded-2xl p-4 text-center border border-white/15">
            <h3 class="text-2xl font-black">Safe</h3>
            <p class="text-sm text-green-50 mt-1">Account</p>
          </div>

          <div class="bg-white/10 rounded-2xl p-4 text-center border border-white/15">
            <h3 class="text-2xl font-black">Easy</h3>
            <p class="text-sm text-green-50 mt-1">Tracking</p>
          </div>
        </div>
      </section>

      <!-- =================================================
           RIGHT SIDE FORM SECTION
           ================================================= -->
      <section class="glass-card rounded-[32px] p-6 md:p-8 lg:p-10">
        <!-- TOP BAR -->
        <div class="flex items-center justify-between gap-3 mb-8">
          <a href="index.html" class="text-3xl font-black text-green-600 tracking-tight lg:hidden">
            Quick<span class="text-orange-500">Root</span>
          </a>

          <a href="index.html" class="bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-2xl font-bold transition">
            ← Back Home
          </a>
        </div>

        <!-- LOGIN BOX -->
        <div id="login-box">
          <p class="text-sm font-bold text-green-600 mb-2">WELCOME</p>
          <h2 class="text-3xl md:text-4xl font-black mb-2">Login to Your Account</h2>
          <!-- <p class="text-slate-500 mb-8">Apna username aur password dal kar login karo.</p> -->

          <div class="space-y-4">
            <div>
              <label class="block text-sm font-bold text-slate-700 mb-2">Username</label>
              <input
                id="username"
                type="text"
                placeholder="Enter username"
                class="w-full p-4 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-green-500"
              >
            </div>

            <div>
              <label class="block text-sm font-bold text-slate-700 mb-2">Password</label>
              <input
                id="password"
                type="password"
                placeholder="Enter password"
                class="w-full p-4 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-green-500"
              >
            </div>
          </div>

          <button
            onclick="login()"
            class="w-full mt-6 bg-green-600 hover:bg-green-700 text-white py-4 rounded-2xl font-black transition"
          >
            Login
          </button>

          <button onclick="showForgotPassword()" class="w-full mt-3 text-green-700 font-bold text-sm">Forgot Password?</button>

          <button
            onclick="showSignup()"
            class="w-full mt-3 bg-slate-100 hover:bg-slate-200 text-slate-800 py-4 rounded-2xl font-black transition"
          >
            Create New Account
          </button>
        </div>

        <!-- FORGOT PASSWORD BOX -->
        <div id="forgot-box" class="hidden">
          <p class="text-sm font-bold text-orange-600 mb-2">RESET PASSWORD</p>
          <h2 class="text-3xl md:text-4xl font-black mb-2">Forgot Password?</h2>
          <div id="forgot-step-1" class="space-y-4">
            <input id="forgotUser" type="text" placeholder="Enter username" class="w-full p-4 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-green-500">
            <input id="forgotPhone" type="text" maxlength="10" placeholder="Registered 10-digit phone number" class="w-full p-4 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-green-500">
            <button onclick="verifyForgotAccount()" class="w-full bg-green-600 hover:bg-green-700 text-white py-4 rounded-2xl font-black">Verify Account</button>
          </div>
          <div id="forgot-step-2" class="hidden space-y-4">
            <div class="bg-green-50 text-green-800 rounded-2xl p-4 font-semibold">Account verified. Create New password.</div>
            <input id="forgotNewPass" type="password" placeholder="New password" class="w-full p-4 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-green-500">
            <input id="forgotConfirmPass" type="password" placeholder="Confirm new password" class="w-full p-4 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-green-500">
            <button onclick="resetPassword()" class="w-full bg-green-600 hover:bg-green-700 text-white py-4 rounded-2xl font-black">Reset Password</button>
          </div>
          <button onclick="showLogin()" class="w-full mt-3 bg-slate-100 hover:bg-slate-200 py-4 rounded-2xl font-black">Back to Login</button>
        </div>

        <!-- SIGNUP BOX -->
        <div id="signup-box" class="hidden">
          <p class="text-sm font-bold text-blue-600 mb-2">CREATE ACCOUNT</p>
          <h2 class="text-3xl md:text-4xl font-black mb-2">Signup New User</h2>

          <div class="space-y-4">
            <div>
              <label class="block text-sm font-bold text-slate-700 mb-2">Full Name</label>
              <input
                id="newName"
                type="text"
                placeholder="Enter full name"
                class="w-full p-4 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-green-500"
              >
            </div>

            <div>
              <label class="block text-sm font-bold text-slate-700 mb-2">Username</label>
              <input
                id="newUser"
                type="text"
                placeholder="Create username"
                class="w-full p-4 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-green-500"
              >
            </div>

            <div>
              <label class="block text-sm font-bold text-slate-700 mb-2">Password</label>
              <input
                id="newPass"
                type="password"
                placeholder="Create password"
                class="w-full p-4 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-green-500"
              >
            </div>

            <div>
              <label class="block text-sm font-bold text-slate-700 mb-2">Phone Number</label>
              <input
                id="newPhone"
                type="text"
                placeholder="Enter phone number"
                class="w-full p-4 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-green-500"
              >
            </div>

            <div>
              <label class="block text-sm font-bold text-slate-700 mb-2">Address</label>
              <textarea
                id="newAddress"
                placeholder="Enter address"
                class="w-full p-4 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-green-500 min-h-[110px]"
              ></textarea>
            </div>
          </div>

          <button
            onclick="signup()"
            class="w-full mt-6 bg-green-600 hover:bg-green-700 text-white py-4 rounded-2xl font-black transition"
          >
            Create Account
          </button>

          <button
            onclick="showLogin()"
            class="w-full mt-3 bg-slate-100 hover:bg-slate-200 text-slate-800 py-4 rounded-2xl font-black transition"
          >
            Back to Login
          </button>
        </div>
      </section>
    </div>
  </main>

  <script src="sheet.js"></script>
  <script>
  function getUsers() {
    return JSON.parse(localStorage.getItem("users")) || [];
  }

  function saveUsers(users) {
    localStorage.setItem("users", JSON.stringify(users));
  }

  function showForgotPassword() {
    document.getElementById("login-box").classList.add("hidden");
    document.getElementById("signup-box").classList.add("hidden");
    document.getElementById("forgot-box").classList.remove("hidden");
    document.getElementById("forgot-step-1").classList.remove("hidden");
    document.getElementById("forgot-step-2").classList.add("hidden");
  }

  function verifyForgotAccount() {
    const username = document.getElementById("forgotUser").value.trim();
    const phone = document.getElementById("forgotPhone").value.trim();
    if (!username || !phone) return alert("Please enter username and registered phone number");
    if (!/^[6-9]\d{9}$/.test(phone)) return alert("Please enter a valid 10-digit phone number");
    const users = getUsers();
    const found = users.find(item => item.username === username && item.phone === phone);
    if (!found) return alert("Account not found. Please check your details.");
    localStorage.setItem("resetUsername", username);
    document.getElementById("forgot-step-1").classList.add("hidden");
    document.getElementById("forgot-step-2").classList.remove("hidden");
  }

  function resetPassword() {
    const username = localStorage.getItem("resetUsername");
    const pass = document.getElementById("forgotNewPass").value.trim();
    const confirm = document.getElementById("forgotConfirmPass").value.trim();
    if (pass.length < 6) return alert("Password must be at least 6 characters");
    if (pass !== confirm) return alert("Passwords do not match");
    const users = getUsers();
    const index = users.findIndex(item => item.username === username);
    if (index === -1) return alert("Account verification expired. Please try again.");
    users[index].password = pass;
    saveUsers(users);
    localStorage.removeItem("resetUsername");
    window.QRSheet && QRSheet.send("password_reset", { username: username });
    alert("Password reset successfully! Please login with your new password.");
    showLogin();
  }

  function showSignup() {
    document.getElementById("login-box").classList.add("hidden");
    document.getElementById("forgot-box").classList.add("hidden");
    document.getElementById("signup-box").classList.remove("hidden");
  }

  function showLogin() {
    document.getElementById("signup-box").classList.add("hidden");
    document.getElementById("forgot-box").classList.add("hidden");
    document.getElementById("login-box").classList.remove("hidden");
  }

  function login() {
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();

    if (!user || !pass) {
      alert("Please enter username and password");
      return;
    }

    const users = getUsers();
    const foundUser = users.find(
      item => item.username === user && item.password === pass
    );

    if (!foundUser) {
      alert("Invalid username or password");
      return;
    }

    localStorage.setItem("isLogin", "true");
    localStorage.setItem("loggedInUser", foundUser.username);
    localStorage.setItem("user", foundUser.username);

    if (!localStorage.getItem("custName")) {
      localStorage.setItem("custName", foundUser.name || foundUser.username);
    }

    if (!localStorage.getItem("custPhone")) {
      localStorage.setItem("custPhone", foundUser.phone || "");
    }

    if (!localStorage.getItem("custAddress")) {
      localStorage.setItem("custAddress", foundUser.address || "");
    }

    window.QRSheet && QRSheet.send("login", { username: foundUser.username, name: foundUser.name || "", phone: foundUser.phone || "", address: foundUser.address || "" });
    alert("Login Successful ✅");
    window.location.href = "index.html";
  }

  function signup() {
    const name = document.getElementById("newName").value.trim();
    const username = document.getElementById("newUser").value.trim();
    const password = document.getElementById("newPass").value.trim();
    const phone = document.getElementById("newPhone").value.trim();
    const address = document.getElementById("newAddress").value.trim();

    if (!name || !username || !password || !phone || !address) {
      alert("Please fill all fields");
      return;
    }

    if (!/^[6-9]\d{9}$/.test(phone)) {
      alert("Please enter a valid 10-digit phone number");
      return;
    }

    const users = getUsers();
    const usernameExists = users.some(item => item.username === username);

    if (usernameExists) {
      alert("Username already exists");
      return;
    }

    users.push({
      name,
      username,
      password,
      phone,
      address
    });

    saveUsers(users);

    localStorage.setItem("isLogin", "true");
    localStorage.setItem("loggedInUser", username);
    localStorage.setItem("user", username);
    localStorage.setItem("custName", name);
    localStorage.setItem("custPhone", phone);
    localStorage.setItem("custAddress", address);

    window.QRSheet && QRSheet.send("signup", { username: username, name: name, phone: phone, address: address });
    alert("Account Created Successfully ✅");
    window.location.href = "index.html";
  }

  window.addEventListener("load", function () {
    if (localStorage.getItem("isLogin") === "true") {
      window.location.href = "index.html";
    }
  });
</script>
</body>
</html>
